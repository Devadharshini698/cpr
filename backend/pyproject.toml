[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "imsr-cpr-debriefing"
version = "0.2.0"
description = "Versioned CPR debrief engine shared by the IMSR simulator and offline workflows"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.7.4,<3", "reportlab>=4.0.7,<5"]

[project.optional-dependencies]
audio = ["faster-whisper>=1.0,<2", "numpy>=1.26,<3", "scipy>=1.11,<2", "pydub>=0.25.1", "librosa>=0.10,<1", "soundfile>=0.12", "python-dotenv>=1", "av>=12"]
diarization = ["pyannote.audio>=3.1,<4", "torch>=2.5,<3", "torchaudio>=2.5,<3", "resemblyzer>=0.1.4", "matplotlib>=3.8,<3.11", "speechbrain>=0.5.14,<1"]
llm = ["openai>=1.30,<3", "anthropic>=0.25,<1", "python-dotenv>=1", "langgraph>=0.2,<2", "langchain-core>=0.3,<2", "langchain-ollama>=0.2,<2"]
dev = ["pytest>=7.4", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["."]
include = ["debriefing*"]
namespaces = true

[tool.setuptools.package-data]
debriefing = ["acls_engine/*.json", "configs/*.yaml", "scenarios/*.json", "analysis/communication_agents/**/*.txt", "analysis/communication_agents/**/*.md"]
